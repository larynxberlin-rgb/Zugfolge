name: zugfolge
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 30s
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: [game-db:/var/lib/postgresql/data]
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] }
  odoo-postgres:
    image: postgres:16.14-trixie
    environment: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: "${ODOO_DB_PASSWORD}", POSTGRES_DB: postgres }
    volumes: [odoo-db:/var/lib/postgresql/data]
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U odoo -d postgres"] }
  odoo-upgrade:
    image: zugfolge-odoo:alpha
    build: { context: ., dockerfile: ops/alpha/odoo/Dockerfile }
    command:
      - odoo
      - --database=zugfolge_odoo
      - --db_host=odoo-postgres
      - --db_user=odoo
      - "--db_password=${ODOO_DB_PASSWORD}"
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/opt/zugfolge-addons
      - --load=base,web,queue_job
      - --workers=0
      - --max-cron-threads=0
      - --without-demo=all
      - --init=queue_job,zugfolge_admin
      - --update=zugfolge_admin
      - --stop-after-init
    environment:
      HOST: odoo-postgres
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD}"
    volumes: [odoo-filestore:/var/lib/odoo]
    depends_on: { odoo-postgres: { condition: service_healthy } }
    restart: "no"
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: [start, --import-realm, --health-enabled=true, --http-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      KC_DB_USERNAME: "${POSTGRES_USER}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL}"
      KC_PROXY_HEADERS: xforwarded
      GAME_WEB_URL: "${GAME_WEB_URL}"
      LIVEMAP_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
      OPERATIONS_CENTER_URL: "${OPERATIONS_CENTER_URL}"
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
    volumes:
      - ./ops/alpha/keycloak/zugfolge-realm.json:/opt/keycloak/data/import/zugfolge-realm.json:ro
      - ./ops/alpha/keycloak/themes/zugfolge:/opt/keycloak/themes/zugfolge:ro
    networks:
      default: {}
      proxy: { aliases: [zugfolge-keycloak] }
      mail: {}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { <<: *health, test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q UP <&3"] }
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
  keycloak-reconcile:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/reconcile-keycloak-clients.mjs]
    env_file: [.env]
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-zugfolge}"
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}"
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}"
      GAME_WEB_URL: "${GAME_WEB_URL}"
      LIVEMAP_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
      OPERATIONS_CENTER_URL: "${OPERATIONS_CENTER_URL:-http://localhost:4175}"
    depends_on: { keycloak: { condition: service_healthy } }
  map-release-preflight:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/map-release-deployment-preflight.mjs, "${MAP_RELEASE_START_PREFLIGHT_MODE:?MAP_RELEASE_START_PREFLIGHT_MODE fehlt}"]
    environment:
      MAP_RELEASE_PREFLIGHT_EVIDENCE_PATH: /map-preflight/evidence.json
      MAP_RELEASE_PREFLIGHT_DEPLOYMENT_ROOT: /map-deployment
      MAP_RELEASE_PREFLIGHT_RESTORE_PROOF_PATH: /map-preflight/restore-proof.json
      MAP_RELEASE_PREFLIGHT_RESTORE_ROOT: /map-restore
      MAP_RELEASE_PREFLIGHT_TRUSTED_KEYS_PATH: /map-preflight/trusted-delivery-keys.json
      MAP_RELEASE_PREFLIGHT_EXPECTED_ACTIVE_RELEASE_ID: "${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}"
    volumes:
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}:/map-deployment:ro"
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
      - "${MAP_RELEASE_RESTORE_HOST_DIR:?MAP_RELEASE_RESTORE_HOST_DIR fehlt}:/map-restore:ro"
    restart: "no"
  game-migrate:
    image: zugfolge-game-api
    command: [node, packages/db/dist/migrate.js]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on: { postgres: { condition: service_healthy }, map-release-preflight: { condition: service_completed_successfully } }
    restart: "no"
  game-bootstrap:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/production-db-bootstrap.mjs]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ALPHA_WORLD_RELEASE_PATHS_JSON: "${ALPHA_WORLD_RELEASE_PATHS_JSON}"
      INFRA_RELEASE_TRUSTED_KEYS_JSON: "${INFRA_RELEASE_TRUSTED_KEYS_JSON}"
    volumes: [./var/alpha-evidence:/evidence:ro]
    depends_on: { game-migrate: { condition: service_completed_successfully } }
    restart: "no"
  game-api:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/start-after-map-release-preflight.mjs, node, apps/game-api/dist/server.js]
    build:
      context: .
      dockerfile: ops/alpha/container/Dockerfile
      args:
        LIVEMAP_BASE_PATH: "${LIVEMAP_BASE_PATH:-/}"
        OPERATIONS_CENTER_BASE_PATH: "${OPERATIONS_CENTER_BASE_PATH:-/}"
        OPERATIONS_CENTER_GAME_API_URL: "${OPERATIONS_CENTER_GAME_API_URL:-/api}"
        ZUGFOLGE_SOURCE_SHA: "${ZUGFOLGE_SOURCE_SHA:-unversioned}"
        ZUGFOLGE_DEPLOY_PATCH_SHA: "${ZUGFOLGE_DEPLOY_PATCH_SHA:-unversioned}"
    env_file: [.env]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_PUBLIC_URL}/realms/zugfolge"
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/zugfolge/protocol/openid-connect/certs"
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      LIVEMAP_READ_MODEL_PATH: /map-release/read-model.sqlite
      LIVEMAP_TRAIN_PROJECTION_PATH: /map-release/train-map-projection.sqlite
      INFRA_PACKAGE_STAGING_ENABLED: "${INFRA_PACKAGE_STAGING_ENABLED:-false}"
      INFRA_PACKAGE_STAGING_ROOT: /infra-package-staging
      INFRA_PACKAGE_VERIFIER_MODULE: /app/tools/tiles/map-package.mjs
      INFRA_UPLOAD_KEYS_JSON: '[{"id":"${INFRA_UPLOAD_KEY_ID}","secret":"${INFRA_UPLOAD_SECRET}"}]'
      ZUGFOLGE_RUNTIME_NATIVE_PATH: /app/native/zugfolge-runtime.node
      ZUGFOLGE_PLANNING_RUNTIME_NATIVE_PATH: /app/native/zugfolge-planning-runtime.node
      MAP_RELEASE_PREFLIGHT_EVIDENCE_PATH: /map-preflight/evidence.json
      MAP_RELEASE_PREFLIGHT_DEPLOYMENT_ROOT: /map-deployment
      MAP_RELEASE_PREFLIGHT_RESTORE_PROOF_PATH: /map-preflight/restore-proof.json
      MAP_RELEASE_PREFLIGHT_RESTORE_ROOT: /map-restore
      MAP_RELEASE_PREFLIGHT_TRUSTED_KEYS_PATH: /map-preflight/trusted-delivery-keys.json
      MAP_RELEASE_PREFLIGHT_EXPECTED_ACTIVE_RELEASE_ID: "${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}"
      MAP_RELEASE_START_PREFLIGHT_MODE: "${MAP_RELEASE_START_PREFLIGHT_MODE:?MAP_RELEASE_START_PREFLIGHT_MODE fehlt}"
    volumes:
      - ./var/alpha-evidence:/evidence:ro
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}/${MAP_RELEASE_HOST_DIR:?MAP_RELEASE_HOST_DIR muss aus active/map-release.env kommen}:/map-release:ro"
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}:/map-deployment:ro"
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
      - "${MAP_RELEASE_RESTORE_HOST_DIR:?MAP_RELEASE_RESTORE_HOST_DIR fehlt}:/map-restore:ro"
      - "${INFRA_PACKAGE_STAGING_HOST_DIR:-./var/infra-package-staging}:/infra-package-staging:rw"
    depends_on: { game-bootstrap: { condition: service_completed_successfully }, keycloak-reconcile: { condition: service_completed_successfully } }
    healthcheck: { <<: *health, start_period: 15m, test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(async r=>{const body=await r.json();if(!r.ok||body.status==='down')process.exit(1)})"] }
    ports: ["${GAME_API_PORT:-3000}:3000"]
  game-web:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/static-server.mjs, apps/game-web/dist, "4173"]
    environment:
      GAME_API_INTERNAL_URL: http://game-api:3000
      GAME_API_PUBLIC_URL: "${GAME_API_PUBLIC_URL:-/api}"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-zugfolge}"
      ALPHA_PUBLIC_WORLD_ID: "${ALPHA_PUBLIC_WORLD_ID}"
      GAME_WEB_PUBLIC_URL: "${GAME_WEB_PUBLIC_URL:-http://localhost:4173}"
      LIVEMAP_PUBLIC_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
    depends_on: { game-api: { condition: service_healthy } }
    networks:
      default: {}
      proxy: { aliases: [zugfolge-world-web] }
    healthcheck: { <<: *health, test: [CMD, node, -e, "fetch('http://localhost:4173/').then(async r=>{if(!r.ok||!(await r.text()).includes('content=\"game-web\"'))process.exit(1)})"] }
    ports: ["${GAME_WEB_PORT:-4173}:4173"]
  livemap:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/start-after-map-release-preflight.mjs, node, tools/alpha-ops/static-server.mjs, apps/livemap/dist, "4174"]
    environment:
      GAME_API_INTERNAL_URL: http://game-api:3000
      GAME_API_PUBLIC_URL: "${GAME_API_PUBLIC_URL:-/api}"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-zugfolge}"
      LIVEMAP_OIDC_CLIENT_ID: "${LIVEMAP_OIDC_CLIENT_ID:-livemap}"
      ALPHA_PUBLIC_WORLD_ID: "${ALPHA_PUBLIC_WORLD_ID}"
      GAME_WEB_PUBLIC_URL: "${GAME_WEB_PUBLIC_URL:-http://localhost:4173}"
      LIVEMAP_PUBLIC_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
      STATIC_ARTIFACT_ROOT: /map-artifacts
      MAP_RELEASE_ID: "${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}"
      MAP_BASEMAP_STYLE_URL: "${MAP_BASEMAP_STYLE_URL:?MAP_BASEMAP_STYLE_URL muss aus active/map-release.env kommen}"
      MAP_GERMANY_PMTILES_URL: "${MAP_GERMANY_PMTILES_URL:?MAP_GERMANY_PMTILES_URL muss aus active/map-release.env kommen}"
      MAP_RELEASE_PREFLIGHT_EVIDENCE_PATH: /map-preflight/evidence.json
      MAP_RELEASE_PREFLIGHT_DEPLOYMENT_ROOT: /map-deployment
      MAP_RELEASE_PREFLIGHT_RESTORE_PROOF_PATH: /map-preflight/restore-proof.json
      MAP_RELEASE_PREFLIGHT_RESTORE_ROOT: /map-restore
      MAP_RELEASE_PREFLIGHT_TRUSTED_KEYS_PATH: /map-preflight/trusted-delivery-keys.json
      MAP_RELEASE_PREFLIGHT_EXPECTED_ACTIVE_RELEASE_ID: "${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}"
      MAP_RELEASE_START_PREFLIGHT_MODE: "${MAP_RELEASE_START_PREFLIGHT_MODE:?MAP_RELEASE_START_PREFLIGHT_MODE fehlt}"
      MAP_ATTRIBUTION: "${MAP_ATTRIBUTION:-© OpenStreetMap-Mitwirkende, ODbL 1.0; Basemap-Aufbereitung Protomaps; weitere Bearbeitung durch Zugfolge}"
    volumes:
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}/${MAP_RELEASE_HOST_DIR:?MAP_RELEASE_HOST_DIR muss aus active/map-release.env kommen}:/map-artifacts/maps/${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}:ro"
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}:/map-deployment:ro"
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
      - "${MAP_RELEASE_RESTORE_HOST_DIR:?MAP_RELEASE_RESTORE_HOST_DIR fehlt}:/map-restore:ro"
    depends_on: { game-api: { condition: service_healthy } }
    networks:
      default: {}
      proxy: { aliases: [zugfolge-world-livemap] }
    healthcheck: { <<: *health, test: [CMD, node, -e, "const b='http://localhost:4174';Promise.all([fetch(b),fetch(b+'/runtime-config.js'),fetch(new URL(process.env.MAP_BASEMAP_STYLE_URL,b),{headers:{range:'bytes=0-0'}}),fetch(new URL(process.env.MAP_GERMANY_PMTILES_URL,b),{headers:{range:'bytes=0-126'}})]).then(async([p,c,s,i])=>{if(!p.ok||!(await p.text()).includes('content=\"livemap\"')||!c.ok||s.status!==206||i.status!==206)process.exit(1)})"] }
    ports: ["${LIVEMAP_PORT:-4174}:4174"]
  operations-center:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/static-server.mjs, apps/operations-center/dist, "4175"]
    environment:
      GAME_API_INTERNAL_URL: http://game-api:3000
      GAME_API_PUBLIC_URL: "${GAME_API_PUBLIC_URL:-/api}"
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-zugfolge}"
      OPERATIONS_CENTER_OIDC_CLIENT_ID: "${OPERATIONS_CENTER_OIDC_CLIENT_ID:-operations-center}"
      GAME_WEB_PUBLIC_URL: "${GAME_WEB_PUBLIC_URL:-http://localhost:4173}"
      OPERATIONS_CENTER_URL: "${OPERATIONS_CENTER_URL:-http://localhost:4175}"
    depends_on: { game-api: { condition: service_healthy } }
    networks:
      default: {}
      proxy: { aliases: [zugfolge-world-operations-center] }
    healthcheck: { <<: *health, test: [CMD, node, -e, "fetch('http://localhost:4175/').then(async r=>{if(!r.ok||!(await r.text()).includes('content=\"operations-center\"'))process.exit(1)})"] }
    ports: ["${OPERATIONS_CENTER_PORT:-4175}:4175"]
  static:
    image: zugfolge-game-api
    command: [node, tools/alpha-ops/static-server.mjs, /evidence/static, "4179"]
    volumes: [./var/alpha-evidence:/evidence:ro]
    ports: ["${STATIC_PORT:-4179}:4179"]
  odoo:
    image: zugfolge-odoo:alpha
    build: { context: ., dockerfile: ops/alpha/odoo/Dockerfile }
    command:
      - odoo
      - --database=zugfolge_odoo
      - --db_host=odoo-postgres
      - --db_user=odoo
      - "--db_password=${ODOO_DB_PASSWORD}"
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/opt/zugfolge-addons
      - --load=base,web,queue_job
      - --workers=2
      - --max-cron-threads=1
    environment:
      HOST: odoo-postgres
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD}"
      ODOO_QUEUE_JOB_CHANNELS: root:2
      ZUGFOLGE_INFRA_UPLOAD_BASE_URL: http://game-api:3000/integrations/odoo/infra-package-imports
      ZUGFOLGE_INFRA_UPLOAD_KEY_ID: "${INFRA_UPLOAD_KEY_ID}"
      ZUGFOLGE_INFRA_UPLOAD_SECRET: "${INFRA_UPLOAD_SECRET}"
    volumes: [odoo-filestore:/var/lib/odoo]
    depends_on: { odoo-upgrade: { condition: service_completed_successfully }, game-api: { condition: service_healthy } }
    networks:
      default: {}
      proxy: { aliases: [zugfolge-odoo] }
      mail: {}
    healthcheck: { <<: *health, test: [CMD-SHELL, "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health')\""] }
    ports: ["${ODOO_PORT:-8069}:8069"]
  alpha-ops:
    profiles: [operations]
    image: zugfolge-odoo:alpha
    build: { context: ., dockerfile: ops/alpha/odoo/Dockerfile }
    entrypoint: [/bin/sh]
    command: [-c, "echo alpha-ops ready"]
    user: "0:0"
    environment:
      PGPASSWORD: "${ODOO_DB_PASSWORD}"
    volumes:
      - ./ops/alpha:/ops/alpha:ro
      - ./tools/alpha-ops:/tools/alpha-ops:ro
      - "${ALPHA_OPS_HOST_DIR:-./var/alpha-ops}:/work"
      - odoo-filestore:/var/lib/odoo:ro
    depends_on: { odoo-postgres: { condition: service_healthy } }
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes: [./ops/alpha/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./ops/alpha/alerts.yml:/etc/prometheus/alerts.yml:ro]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}" }
    volumes: [./ops/alpha/grafana/provisioning:/etc/grafana/provisioning:ro, ./ops/alpha/grafana/zugfolge-alpha.json:/var/lib/grafana/dashboards/zugfolge-alpha.json:ro, grafana-data:/var/lib/grafana]
    depends_on: [prometheus]
    ports: ["${GRAFANA_PORT:-3001}:3000"]
volumes: { game-db: {}, odoo-db: {}, odoo-filestore: {}, grafana-data: {} }
networks:
  proxy: { external: true, name: zugfolge-proxy }
  mail: { external: true, name: zugfolge-mail }
