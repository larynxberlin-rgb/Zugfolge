name: zugfolge
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 30s
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes:
      - game-db:/var/lib/postgresql/data
      - ./ops/alpha/postgres/010-keycloak-schema.sql:/docker-entrypoint-initdb.d/010-keycloak-schema.sql:ro
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] }
  odoo-postgres:
    image: postgres:16.14-trixie
    environment: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: "${ODOO_DB_PASSWORD}", POSTGRES_DB: postgres }
    volumes: [odoo-db:/var/lib/postgresql/data]
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U odoo -d postgres"] }
  recovery-verify-postgres:
    profiles: [production-recovery-preparation]
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: postgres }
    volumes: [recovery-verify-db:/var/lib/postgresql/data]
    networks: { schema29-recovery: {} }
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d postgres"] }
  recovery-verify-odoo-postgres:
    profiles: [production-recovery-preparation]
    image: postgres:16.14-trixie
    environment: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: "${ODOO_DB_PASSWORD}", POSTGRES_DB: postgres }
    volumes: [recovery-verify-odoo-db:/var/lib/postgresql/data]
    networks: { schema29-recovery: {} }
    healthcheck: { <<: *health, test: [CMD-SHELL, "pg_isready -U odoo -d postgres"] }
  odoo-upgrade:
    image: "${ZUGFOLGE_ODOO_IMAGE_REFERENCE:?ZUGFOLGE_ODOO_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    build:
      context: .
      dockerfile: ops/alpha/odoo/Dockerfile
      args:
        ZUGFOLGE_SOURCE_SHA: "${ZUGFOLGE_SOURCE_SHA:-unversioned}"
        ZUGFOLGE_DEPLOY_PATCH_SHA: "${ZUGFOLGE_DEPLOY_PATCH_SHA:-unversioned}"
    command:
      - odoo
      - "--database=${ODOO_DB_NAME:?ODOO_DB_NAME fehlt}"
      - --db_host=odoo-postgres
      - --db_user=odoo
      - "--db_password=${ODOO_DB_PASSWORD}"
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/opt/zugfolge-addons
      - --load=base,web,queue_job
      - --workers=0
      - --max-cron-threads=0
      - --without-demo=all
      - --init=queue_job,zugfolge_admin
      - --update=zugfolge_admin
      - --stop-after-init
    environment:
      HOST: odoo-postgres
      USER: odoo
      PASSWORD: "${ODOO_DB_PASSWORD}"
    volumes: [odoo-filestore:/var/lib/odoo]
    depends_on: { odoo-postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  keycloak-schema-migrate:
    profiles: [keycloak-schema-migration]
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    user: "${KEYCLOAK_SCHEMA_OPERATOR_UID:-1000}:${KEYCLOAK_SCHEMA_OPERATOR_GID:-1000}"
    command: [node, tools/alpha-ops/keycloak-public-to-schema.mjs, "${KEYCLOAK_SCHEMA_ACTION:-inspect}"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      KEYCLOAK_SCHEMA_CATALOG_PATH: /keycloak-schema-catalog.json
      KEYCLOAK_SCHEMA_BACKUP_MANIFEST_PATH: /keycloak-backup/game.manifest.json
      KEYCLOAK_SCHEMA_BACKUP_DUMP_PATH: /keycloak-backup/game.dump
      KEYCLOAK_SCHEMA_RESTORED_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${KEYCLOAK_SCHEMA_RESTORE_DATABASE:-zugfolge_restore_keycloak_schema}"
      KEYCLOAK_SCHEMA_RESTORE_RECEIPT_PATH: "${KEYCLOAK_SCHEMA_RESTORE_RECEIPT_CONTAINER_PATH:-/keycloak-schema/restore-receipt.json}"
      KEYCLOAK_SCHEMA_BACKUP_BINDING_PATH: "${KEYCLOAK_SCHEMA_BACKUP_BINDING_CONTAINER_PATH:-/keycloak-schema/backup-binding.json}"
      KEYCLOAK_SCHEMA_BACKUP_BINDING_OUTPUT_PATH: "${KEYCLOAK_SCHEMA_BACKUP_BINDING_CONTAINER_PATH:-/keycloak-schema/backup-binding.json}"
      KEYCLOAK_SCHEMA_PLAN_PATH: "${KEYCLOAK_SCHEMA_PLAN_CONTAINER_PATH:-/keycloak-schema/plan.json}"
      KEYCLOAK_SCHEMA_PLAN_OUTPUT_PATH: "${KEYCLOAK_SCHEMA_PLAN_CONTAINER_PATH:-/keycloak-schema/plan.json}"
      KEYCLOAK_SCHEMA_RECEIPT_PATH: "${KEYCLOAK_SCHEMA_RECEIPT_CONTAINER_PATH:-/keycloak-schema/receipt.json}"
      KEYCLOAK_SCHEMA_RECEIPT_OUTPUT_PATH: "${KEYCLOAK_SCHEMA_RECEIPT_OUTPUT_CONTAINER_PATH:-/keycloak-schema/receipt.json}"
      KEYCLOAK_SCHEMA_WRITERS_QUIESCED: "${KEYCLOAK_SCHEMA_WRITERS_QUIESCED:-false}"
    volumes:
      - ./ops/alpha/keycloak/keycloak-pg16-object-catalog.26.7.0.json:/keycloak-schema-catalog.json:ro
      - "${KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR:?KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR fehlt}:/keycloak-schema:rw"
      - "${KEYCLOAK_SCHEMA_BACKUP_HOST_DIR:?KEYCLOAK_SCHEMA_BACKUP_HOST_DIR fehlt}:/keycloak-backup:ro"
    depends_on: { postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  keycloak-schema-backup:
    profiles: [keycloak-schema-migration]
    image: postgres:16.14-trixie
    user: "${KEYCLOAK_SCHEMA_OPERATOR_UID:-1000}:${KEYCLOAK_SCHEMA_OPERATOR_GID:-1000}"
    entrypoint: [sh, -eu, -c]
    command: ['sh /ops/backup-game.sh "$$DATABASE_URL" /keycloak-backup/game.dump /keycloak-backup/game.manifest.json']
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    volumes:
      - ./ops/alpha/backup-game.sh:/ops/backup-game.sh:ro
      - "${KEYCLOAK_SCHEMA_BACKUP_HOST_DIR:?KEYCLOAK_SCHEMA_BACKUP_HOST_DIR fehlt}:/keycloak-backup:rw"
    depends_on: { postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  keycloak-schema-restore:
    profiles: [keycloak-schema-migration]
    image: postgres:16.14-trixie
    user: "${KEYCLOAK_SCHEMA_OPERATOR_UID:-1000}:${KEYCLOAK_SCHEMA_OPERATOR_GID:-1000}"
    entrypoint: [sh, -eu, -c]
    command: ['test "$$KEYCLOAK_SCHEMA_RESTORE_DATABASE" != "$$KEYCLOAK_SCHEMA_LIVE_DATABASE"; test ! -e "$$KEYCLOAK_SCHEMA_RESTORE_RECEIPT_PATH"; sh /ops/restore-game.sh "$$DATABASE_ADMIN_URL" "$$KEYCLOAK_SCHEMA_RESTORE_DATABASE" /keycloak-backup/game.dump /keycloak-backup/game.manifest.json "$$KEYCLOAK_SCHEMA_RESTORE_RECEIPT_PATH"']
    environment:
      DATABASE_ADMIN_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres"
      KEYCLOAK_SCHEMA_LIVE_DATABASE: "${POSTGRES_DB}"
      KEYCLOAK_SCHEMA_RESTORE_DATABASE: "${KEYCLOAK_SCHEMA_RESTORE_DATABASE:-zugfolge_restore_keycloak_schema}"
      KEYCLOAK_SCHEMA_RESTORE_RECEIPT_PATH: "${KEYCLOAK_SCHEMA_RESTORE_RECEIPT_CONTAINER_PATH:-/keycloak-schema/restore-receipt.json}"
    volumes:
      - ./ops/alpha/restore-game.sh:/ops/restore-game.sh:ro
      - "${KEYCLOAK_SCHEMA_BACKUP_HOST_DIR:?KEYCLOAK_SCHEMA_BACKUP_HOST_DIR fehlt}:/keycloak-backup:ro"
      - "${KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR:?KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR fehlt}:/keycloak-schema:rw"
    depends_on: { postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  keycloak-schema-preflight:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    user: "${KEYCLOAK_SCHEMA_OPERATOR_UID:-1000}:${KEYCLOAK_SCHEMA_OPERATOR_GID:-1000}"
    command: [node, tools/alpha-ops/keycloak-public-to-schema.mjs, preflight]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      KEYCLOAK_SCHEMA_CATALOG_PATH: /keycloak-schema-catalog.json
      KEYCLOAK_SCHEMA_RECEIPT_PATH: "${KEYCLOAK_SCHEMA_RECEIPT_CONTAINER_PATH-/keycloak-schema/receipt.json}"
      KEYCLOAK_SCHEMA_BOOTSTRAP_ALLOWED: "${KEYCLOAK_SCHEMA_BOOTSTRAP_ALLOWED:-false}"
    volumes:
      - ./ops/alpha/keycloak/keycloak-pg16-object-catalog.26.7.0.json:/keycloak-schema-catalog.json:ro
      - "${KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR:?KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR fehlt}:/keycloak-schema:ro"
    depends_on: { postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: [start, --import-realm, --health-enabled=true, --http-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      KC_DB_USERNAME: "${POSTGRES_USER}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL}"
      KC_PROXY_HEADERS: xforwarded
      GAME_WEB_URL: "${GAME_WEB_URL}"
      LIVEMAP_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
      OPERATIONS_CENTER_URL: "${OPERATIONS_CENTER_URL}"
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
    volumes:
      - ./ops/alpha/keycloak/zugfolge-realm.json:/opt/keycloak/data/import/zugfolge-realm.json:ro
      - ./ops/alpha/keycloak/themes/zugfolge:/opt/keycloak/themes/zugfolge:ro
    networks:
      default: {}
      proxy: { aliases: [zugfolge-keycloak] }
      mail: {}
    depends_on: { keycloak-schema-preflight: { condition: service_completed_successfully } }
    healthcheck: { <<: *health, test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q UP <&3"] }
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
  keycloak-schema-postflight:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    user: "${KEYCLOAK_SCHEMA_OPERATOR_UID:-1000}:${KEYCLOAK_SCHEMA_OPERATOR_GID:-1000}"
    command: [node, tools/alpha-ops/keycloak-public-to-schema.mjs, postflight]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      KEYCLOAK_SCHEMA_CATALOG_PATH: /keycloak-schema-catalog.json
      KEYCLOAK_SCHEMA_RECEIPT_PATH: "${KEYCLOAK_SCHEMA_RECEIPT_CONTAINER_PATH-/keycloak-schema/receipt.json}"
      KEYCLOAK_SCHEMA_BOOTSTRAP_RECEIPT_OUTPUT_PATH: "${KEYCLOAK_SCHEMA_BOOTSTRAP_RECEIPT_OUTPUT_CONTAINER_PATH:-/keycloak-schema/receipt.json}"
      KEYCLOAK_SCHEMA_BOOTSTRAP_ALLOWED: "${KEYCLOAK_SCHEMA_BOOTSTRAP_ALLOWED:-false}"
    volumes:
      - ./ops/alpha/keycloak/keycloak-pg16-object-catalog.26.7.0.json:/keycloak-schema-catalog.json:ro
      - "${KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR:?KEYCLOAK_SCHEMA_EVIDENCE_HOST_DIR fehlt}:/keycloak-schema:rw"
    depends_on: { keycloak: { condition: service_healthy }, game-migrate: { condition: service_completed_successfully } }
    restart: "no"
  keycloak-reconcile:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, tools/alpha-ops/reconcile-keycloak-clients.mjs]
    env_file: [.env]
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-zugfolge}"
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}"
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}"
      GAME_WEB_URL: "${GAME_WEB_URL}"
      LIVEMAP_URL: "${LIVEMAP_PUBLIC_URL:-http://localhost:4174}"
      OPERATIONS_CENTER_URL: "${OPERATIONS_CENTER_URL:-http://localhost:4175}"
    depends_on: { keycloak-schema-postflight: { condition: service_completed_successfully }, game-bootstrap: { condition: service_completed_successfully } }
  map-release-preflight:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, tools/alpha-ops/map-release-deployment-preflight.mjs, "${MAP_RELEASE_START_PREFLIGHT_MODE:?MAP_RELEASE_START_PREFLIGHT_MODE fehlt}"]
    environment:
      MAP_RELEASE_PREFLIGHT_EVIDENCE_PATH: /map-preflight/evidence.json
      MAP_RELEASE_PREFLIGHT_DEPLOYMENT_ROOT: /map-deployment
      MAP_RELEASE_PREFLIGHT_RESTORE_PROOF_PATH: /map-preflight/restore-proof.json
      MAP_RELEASE_PREFLIGHT_RESTORE_ROOT: /map-restore
      MAP_RELEASE_PREFLIGHT_TRUSTED_KEYS_PATH: /map-preflight/trusted-delivery-keys.json
      MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH: "${MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH:?MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH fehlt}"
      MAP_RELEASE_PREFLIGHT_RUNTIME_SOURCE_COMMIT: "${MAP_RELEASE_PREFLIGHT_RUNTIME_SOURCE_COMMIT:?MAP_RELEASE_PREFLIGHT_RUNTIME_SOURCE_COMMIT fehlt}"
      MAP_RELEASE_PREFLIGHT_RUNTIME_IMAGE_DIGEST: "${MAP_RELEASE_PREFLIGHT_RUNTIME_IMAGE_DIGEST:?MAP_RELEASE_PREFLIGHT_RUNTIME_IMAGE_DIGEST fehlt}"
      PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST: "${PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST:?PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST fehlt}"
      MAP_RELEASE_PREFLIGHT_RUNTIME_WORLD_DEPLOYMENT_PATH: "${MAP_RELEASE_PREFLIGHT_RUNTIME_WORLD_DEPLOYMENT_PATH:?MAP_RELEASE_PREFLIGHT_RUNTIME_WORLD_DEPLOYMENT_PATH fehlt}"
      MAP_RELEASE_PREFLIGHT_EXPECTED_ACTIVE_RELEASE_ID: "${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}"
      RELEASE_TRUSTED_KEY_SCOPES_JSON: "${RELEASE_TRUSTED_KEY_SCOPES_JSON:?RELEASE_TRUSTED_KEY_SCOPES_JSON fehlt}"
    volumes:
      - ./var/alpha-evidence:/evidence:ro
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}:/map-deployment:ro"
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
      - "${MAP_RELEASE_RESTORE_HOST_DIR:?MAP_RELEASE_RESTORE_HOST_DIR fehlt}:/map-restore:ro"
    depends_on: { production-recovery-action: { condition: service_completed_successfully } }
    restart: "no"
  world-deployment-cutover-preflight:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, tools/alpha-ops/world-deployment-cutover-preflight.mjs]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ALPHA_WORLD_RELEASE_PATHS_JSON: "${ALPHA_WORLD_RELEASE_PATHS_JSON}"
      INFRA_RELEASE_TRUSTED_KEYS_JSON: "${INFRA_RELEASE_TRUSTED_KEYS_JSON}"
      RELEASE_TRUSTED_KEY_SCOPES_JSON: "${RELEASE_TRUSTED_KEY_SCOPES_JSON:?RELEASE_TRUSTED_KEY_SCOPES_JSON fehlt}"
      ALPHA_PUBLIC_WORLD_ID: "${ALPHA_PUBLIC_WORLD_ID}"
      ALPHA_WORLD_V2_CUTOVER_AUTHORIZATION_JSON: "${ALPHA_WORLD_V2_CUTOVER_AUTHORIZATION_JSON:-}"
      LIVEMAP_READ_MODEL_PATH: /map-release/read-model.sqlite
    volumes:
      - ./var/alpha-evidence:/evidence:ro
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}/${MAP_RELEASE_HOST_DIR:?MAP_RELEASE_HOST_DIR muss aus active/map-release.env kommen}:/map-release:ro"
    depends_on: { postgres: { condition: service_healthy }, map-release-preflight: { condition: service_completed_successfully } }
    restart: "no"
  game-migrate:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, packages/db/dist/migrate.js]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on: { postgres: { condition: service_healthy }, production-recovery-action: { condition: service_completed_successfully }, keycloak-schema-preflight: { condition: service_completed_successfully }, map-release-preflight: { condition: service_completed_successfully }, world-deployment-cutover-preflight: { condition: service_completed_successfully } }
    restart: "no"
  game-bootstrap:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, tools/alpha-ops/production-db-bootstrap.mjs]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ALPHA_WORLD_RELEASE_PATHS_JSON: "${ALPHA_WORLD_RELEASE_PATHS_JSON}"
      INFRA_RELEASE_TRUSTED_KEYS_JSON: "${INFRA_RELEASE_TRUSTED_KEYS_JSON}"
      RELEASE_TRUSTED_KEY_SCOPES_JSON: "${RELEASE_TRUSTED_KEY_SCOPES_JSON:?RELEASE_TRUSTED_KEY_SCOPES_JSON fehlt}"
      ALPHA_WORLD_V2_CUTOVER_AUTHORIZATION_JSON: "${ALPHA_WORLD_V2_CUTOVER_AUTHORIZATION_JSON:-}"
      ALPHA_PUBLIC_WORLD_ID: "${ALPHA_PUBLIC_WORLD_ID}"
      LIVEMAP_READ_MODEL_PATH: /map-release/read-model.sqlite
      MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH: /map-preflight/database-rollback-proof.json
      KEYCLOAK_SCHEMA_CATALOG_PATH: /keycloak-schema-catalog.json
    volumes:
      - ./ops/alpha/keycloak/keycloak-pg16-object-catalog.26.7.0.json:/keycloak-schema-catalog.json:ro
      - ./var/alpha-evidence:/evidence:ro
      - "${MAP_RELEASE_DEPLOYMENT_HOST_ROOT:?MAP_RELEASE_DEPLOYMENT_HOST_ROOT fehlt}/${MAP_RELEASE_HOST_DIR:?MAP_RELEASE_HOST_DIR muss aus active/map-release.env kommen}:/map-release:ro"
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
    depends_on: { game-migrate: { condition: service_completed_successfully }, keycloak-schema-postflight: { condition: service_completed_successfully } }
    restart: "no"
  game-api:
    image: "${ZUGFOLGE_GAME_API_IMAGE_REFERENCE:?ZUGFOLGE_GAME_API_IMAGE_REFERENCE muss ein unveraenderlicher sha256-Imageverweis sein}"
    pull_policy: never
    command: [node, tools/alpha-ops/start-after-map-release-preflight.mjs, node, apps/game-api/dist/server.js]
    build:
      context: .
      dockerfile: ops/alpha/container/Dockerfile
      args:
        LIVEMAP_BASE_PATH: "${LIVEMAP_BASE_PATH:-/}"
        OPERATIONS_CENTER_BASE_PATH: "${OPERATIONS_CENTER_BASE_PATH:-/}"
        OPERATIONS_CENTER_GAME_API_URL: "${OPERATIONS_CENTER_GAME_API_URL:-/api}"
        ZUGFOLGE_SOURCE_SHA: "${ZUGFOLGE_SOURCE_SHA:-unversioned}"
        ZUGFOLGE_DEPLOY_PATCH_SHA: "${ZUGFOLGE_DEPLOY_PATCH_SHA:-unversioned}"
    env_file: [.env]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      RELEASE_TRUSTED_KEY_SCOPES_JSON: "${RELEASE_TRUSTED_KEY_SCOPES_JSON:?RELEASE_TRUSTED_KEY_SCOPES_JSON fehlt}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_PUBLIC_URL}/realms/zugfolge"
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/zugfolge/protocol/openid-connect/certs"
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      LIVEMAP_READ_MODEL_PATH: /map-release/read-model.sqlite
      INFRA_PACKAGE_STAGING_ENABLED: "${INFRA_PACKAGE_STAGING_ENABLED:-false}"
      INFRA_PACKAGE_STAGING_ROOT: /infra-package-staging
      INFRA_PACKAGE_VERIFIER_MODULE: /app/tools/tiles/map-package.mjs
      INFRA_UPLOAD_KEYS_JSON: '[{"id":"${INFRA_UPLOAD_KEY_ID}","secret":"${INFRA_UPLOAD_SECRET}"}]'
      ZUGFOLGE_RUNTIME_NATIVE_PATH: /app/native/zugfolge-runtime.node
      ZUGFOLGE_OPERATIONAL_INFRASTRUCTURE_ROOTS_JSON: '{"${MAP_RELEASE_ID:?MAP_RELEASE_ID muss aus active/map-release.env kommen}":"/map-release","tutorial-minimal-2026.1:operational-infra":"/app/apps/game-api/tutorial-infrastructure/tutorial-minimal-2026.1"}'
      ZUGFOLGE_PLANNING_RUNTIME_NATIVE_PATH: /app/native/zugfolge-planning-runtime.node
      MAP_RELEASE_PREFLIGHT_EVIDENCE_PATH: /map-preflight/evidence.json
