      PRODUCTION_RECOVERY_GAME_MANIFEST_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.game.manifest.json"
      PRODUCTION_RECOVERY_GAME_BACKUP_OPERATION_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.game.operation.json"
      PRODUCTION_RECOVERY_GAME_BACKUP_MANIFEST_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.database-backup-manifest.json"
      PRODUCTION_RECOVERY_GAME_RESTORE_PROOF_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.database-restore-proof.json"
      PRODUCTION_RECOVERY_GAME_RESTORE_RECEIPT_PATH: "/production-recovery/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.game-recovery.json"
      PRODUCTION_RECOVERY_ODOO_DATABASE_DUMP_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.odoo.database.dump"
      PRODUCTION_RECOVERY_ODOO_FILESTORE_ARCHIVE_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.odoo.filestore.tar.gz"
      PRODUCTION_RECOVERY_ODOO_BACKUP_MANIFEST_PATH: "/recovery-material/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.odoo.manifest.json"
      PRODUCTION_RECOVERY_ODOO_RESTORE_RECEIPT_PATH: "/production-recovery/${PRODUCTION_RECOVERY_ID:?PRODUCTION_RECOVERY_ID fehlt}.hot.odoo-recovery.json"
      PRODUCTION_RECOVERY_ODOO_RESTORED_FILESTORE_PATH: "/odoo-recovery-filestore/${PRODUCTION_RECOVERY_ODOO_RESTORE_DATABASE:?PRODUCTION_RECOVERY_ODOO_RESTORE_DATABASE fehlt}"
      PRODUCTION_RECOVERY_RECEIPT_OUTPUT_PATH: /production-recovery/recovery.json
      PRODUCTION_RECOVERY_PROMOTION_OUTPUT_PATH: /production-recovery/promotion.json
      PRODUCTION_RECOVERY_LEGACY_GAME_SOURCE_COMMIT: "${MAP_RELEASE_PREFLIGHT_RUNTIME_SOURCE_COMMIT:?MAP_RELEASE_PREFLIGHT_RUNTIME_SOURCE_COMMIT fehlt}"
      PRODUCTION_RECOVERY_LEGACY_GAME_IMAGE_DIGEST: "${MAP_RELEASE_PREFLIGHT_RUNTIME_IMAGE_DIGEST:?MAP_RELEASE_PREFLIGHT_RUNTIME_IMAGE_DIGEST fehlt}"
      PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST: "${PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST:?PRODUCTION_RECOVERY_ODOO_IMAGE_DIGEST fehlt}"
      PRODUCTION_RECOVERY_RUNTIME_ROLLBACK_ATTESTATION_PATH: /map-preflight/runtime-rollback-attestation.json
      PRODUCTION_RECOVERY_RUNTIME_ROLLBACK_TRUSTED_KEYS_PATH: /map-preflight/trusted-rollback-keys.json
      PRODUCTION_RECOVERY_ATTESTED_WORLD_DEPLOYMENT_PATH: "${MAP_RELEASE_PREFLIGHT_RUNTIME_WORLD_DEPLOYMENT_PATH:?MAP_RELEASE_PREFLIGHT_RUNTIME_WORLD_DEPLOYMENT_PATH fehlt}"
      PRODUCTION_RECOVERY_DATABASE_ROLLBACK_PROOF_PATH: "${MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH:?MAP_RELEASE_PREFLIGHT_DATABASE_ROLLBACK_PROOF_PATH fehlt}"
      PRODUCTION_RECOVERY_DOCKER_PROJECT: zugfolge
      PRODUCTION_RECOVERY_DOCKER_SOCKET_PATH: /var/run/docker.sock
      PRODUCTION_RECOVERY_CONTROL_SERVICE: production-recovery-action
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${PRODUCTION_RECOVERY_EVIDENCE_HOST_ROOT:?PRODUCTION_RECOVERY_EVIDENCE_HOST_ROOT fehlt}:/production-recovery:rw"
      - "${PRODUCTION_RECOVERY_ODOO_FILESTORE_HOST_ROOT:?PRODUCTION_RECOVERY_ODOO_FILESTORE_HOST_ROOT fehlt}:/odoo-recovery-filestore:rw"
      - "${PRODUCTION_RECOVERY_BACKUP_HOST_ROOT:?PRODUCTION_RECOVERY_BACKUP_HOST_ROOT fehlt}:/recovery-material:ro"
      - ./var/alpha-evidence:/evidence:ro
      - "${MAP_RELEASE_PREFLIGHT_HOST_DIR:?MAP_RELEASE_PREFLIGHT_HOST_DIR fehlt}:/map-preflight:ro"
    depends_on: { postgres: { condition: service_healthy }, odoo-postgres: { condition: service_healthy } }
    restart: "no"
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes: [./ops/alpha/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./ops/alpha/alerts.yml:/etc/prometheus/alerts.yml:ro]
    depends_on: { production-recovery-action: { condition: service_completed_successfully } }
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}" }
    volumes: [./ops/alpha/grafana/provisioning:/etc/grafana/provisioning:ro, ./ops/alpha/grafana/zugfolge-alpha.json:/var/lib/grafana/dashboards/zugfolge-alpha.json:ro, grafana-data:/var/lib/grafana]
    depends_on: [prometheus]
    ports: ["${GRAFANA_PORT:-3001}:3000"]
volumes: { game-db: {}, odoo-db: {}, odoo-filestore: {}, recovery-verify-db: {}, recovery-verify-odoo-db: {}, grafana-data: {} }
networks:
  schema29-recovery: { internal: true, name: zugfolge-schema29-recovery }
  proxy: { external: true, name: zugfolge-proxy }
  mail: { external: true, name: zugfolge-mail }
