[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "tools/load", "tools/m7-acceptance", "tools/reference-model"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/larynxberlin-rgb/Zugfolge"
publish = false

[workspace.dependencies]
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Die Version steht ausdrücklich dabei, obwohl der Pfad genügte: Ohne sie ist
# die Anforderung ein Platzhalter, und `cargo-deny` verbietet Platzhalter
# (deny.toml, [bans] wildcards).
zugfolge-determinism = { path = "crates/zugfolge-determinism", version = "0.0.0" }
zugfolge-infra = { path = "crates/zugfolge-infra", version = "0.0.0" }
zugfolge-conflict = { path = "crates/zugfolge-conflict", version = "0.0.0" }
zugfolge-planner = { path = "crates/zugfolge-planner", version = "0.0.0" }
zugfolge-sim = { path = "crates/zugfolge-sim", version = "0.0.0" }
zugfolge-fleet = { path = "crates/zugfolge-fleet", version = "0.0.0" }
zugfolge-rules = { path = "crates/zugfolge-rules", version = "0.0.0" }
zugfolge-disruption = { path = "crates/zugfolge-disruption", version = "0.0.0" }

# Die harten Invarianten aus CLAUDE.md, soweit der Compiler sie halten kann.
# Was der Compiler nicht sieht, prüft `tools/guards` (siehe docs/monorepo.md).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Invariante 3 — keine Gleitkommazahlen im zustandsrelevanten Pfad.
float_arithmetic = "deny"
float_cmp = "deny"
# Invariante 2 und 7 sowie Determinismus: verbotene Typen und Methoden
# stehen in clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"
# Ganzzahlige Zustandswerte dürfen nicht still überlaufen oder abschneiden.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
