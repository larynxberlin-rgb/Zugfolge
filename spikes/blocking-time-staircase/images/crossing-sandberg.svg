  <text x="36" y="72" fill="#8B93A7" font-family="IBM Plex Sans, Inter, Source Sans 3, system-ui, sans-serif" font-size="14">RB 26802 räumt den Ast, bevor RB 26801 ihn befährt. Die beiden Züge begegnen sich in Sandberg an verschiedenen Bahnsteiggleisen — konfliktfrei.</text>
