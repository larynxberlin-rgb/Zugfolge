  <text x="36" y="780" fill="#8B93A7" font-family="IBM Plex Sans, Inter, Source Sans 3, system-ui, sans-serif" font-size="12">Sperrzeit = Fahrstraßenbildezeit + Signalsichtzeit + Annäherungsfahrzeit + Fahrzeit + Räumfahrzeit + Fahrstraßenauflösezeit. Nebeneinanderliegende Gleise sind zur Unterscheidung um wenige Pixel versetzt gezeichnet.</text>
