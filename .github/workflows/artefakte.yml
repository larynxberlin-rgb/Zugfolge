name: Artefakte erzeugen

# Erzeugt die Dateien, die man nicht von Hand schreibt, und lädt sie als
# Artefakt hoch: Sperrdateien, formatierte Quellen und Golden-Master.
#
# Wird von Hand gestartet. Zwei Anlässe:
#
# 1. Bootstrap — solange es noch keine Cargo.lock und keine pnpm-lock.yaml
#    gibt und der erste Golden-Master fehlt.
# 2. Nach einer bewussten Regeländerung, die einen Golden-Master verschiebt.
#    Der neue Stand wird heruntergeladen, geprüft und mit Begründung committet
#    — nie blind überschrieben.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erzeugen:
    name: Sperrdateien, Formatierung, Golden-Master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Alte Sperrdateien verwerfen
        # Dieser Workflow erzeugt die Sperrdateien **neu**. Eine bestehende
        # Datei einfach fortzuschreiben führt dazu, dass alte Auflösungen
        # überleben — etwa eine Paketversion, die eine später eingeführte
        # Lieferkettenregel gar nicht mehr zuließe.
        run: rm -f Cargo.lock pnpm-lock.yaml

      - name: Cargo.lock erzeugen
        run: cargo fetch

      - name: Quellen formatieren
        run: cargo fmt --all

      - name: Golden-Master neu schreiben
        continue-on-error: true
        env:
          ZUGFOLGE_GOLDEN_UPDATE: "1"
        run: cargo test --workspace

      # Der Bildfahrplan des M0.3-Spikes ist ebenfalls ein erzeugtes Artefakt:
      # Er wird gezeichnet, nicht geschrieben, und muss zur Rechnung passen.
      - name: Bildfahrpläne des Spikes neu zeichnen
        continue-on-error: true
        run: cargo run -p zugfolge-spike-blocking-time-staircase

      - name: pnpm-lock.yaml erzeugen
        run: pnpm install --no-frozen-lockfile

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artefakte
          path: |
            Cargo.lock
            pnpm-lock.yaml
            crates/
            spikes/
          if-no-files-found: error
