name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Zugfolge wird ausschließlich auf Linux betrieben. Der Golden-Master
    # beweist die Reproduzierbarkeit deshalb auf der unterstützten Plattform.
    name: Rust und Determinismus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Formatierung
        run: cargo fmt --all --check

      - name: Clippy (Invarianten 2, 3 und 7)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests und Golden-Master
        run: |
          cargo test --workspace --locked
          cargo test --locked --offline -p zugfolge-sim-runtime --example operational_json

      - name: Freie Nachfragequellen und Holdout-Trennung
        run: python3 -m unittest discover -s tools/demand-calibration -p 'test_*.py'

      - name: Einwohnerimport und Stationsnachfrage mit echtem Rust-Kern
        run: |
          cargo build --locked -p zugfolge-demand --example evaluate_json
          ZUGFOLGE_DEMAND_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/examples/evaluate_json" python3 -m unittest discover -s tools/population-demand -p 'test_*.py'

      - name: Direkte Odoo-Nachfragedaten ohne Odoo-Laufzeit pruefen
        run: python3 odoo/addons/zugfolge_admin/tests/test_demand_data_contract.py

      - name: Rust-Abhaengigkeiten pruefen
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses sources advisories

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bau vor Typprüfung: Seit M2.1 hängt apps/game-api als Workspace-Paket
      # von packages/identity ab und löst es über dessen dist/-Ausgabe auf
      # (package.json "exports"). pnpm baut rekursive Skripte zwar
      # topologisch sortiert, aber "typecheck" und "build" sind zwei
      # getrennte Skriptläufe — ohne einen vorherigen Bau fehlt dist/ noch,
      # wenn die Typprüfung eines abhängigen Pakets läuft.
      - name: Bau
        run: pnpm -r --stream build

      - name: Typprüfung
        run: pnpm -r --stream typecheck

      - name: App- und Pakettests einmal ausfuehren
        run: pnpm test

      - name: Echten Pixelart-Korpus gegen Manifest und Belegbytes prüfen
        run: pnpm --filter @zugfolge/conductor-art check:release

      - name: Szenenquellen, Compilerbindungen und Browser-Evidenzpaket prüfen
        run: node --test tools/conductor-scenes/source-compiler.test.mjs tools/conductor-session/package-evidence.test.mjs tools/conductor-session/browser-driver.test.mjs

  native-runtime-smoke:
    name: Native Runtime ABI (Linux, echtes NAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-trixie
        env:
          POSTGRES_USER: zugfolge
          POSTGRES_PASSWORD: zugfolge-test
          POSTGRES_DB: zugfolge_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zugfolge -d zugfolge_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: native-runtime-node-addon

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript-Grenze bauen
        run: pnpm --filter @zugfolge/runtime-native build

      - name: Linux-Node-Addon mit registrierter NAPI-Grenze bauen
        run: cargo build --release --locked -p zugfolge-runtime-napi --features node-addon

      - name: cdylib als Node-Addon bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          addon_path="${RUNNER_TEMP}/zugfolge-runtime-napi.node"
          test -f target/release/libzugfolge_runtime_napi.so
          install -m 0755 target/release/libzugfolge_runtime_napi.so "${addon_path}"
          file "${addon_path}"
          printf 'ZUGFOLGE_RUNTIME_NATIVE_PATH=%s\n' "${addon_path}" >> "${GITHUB_ENV}"

      - name: Initialize-, Apply-, Hash- und Idempotenz-Smoke
        run: pnpm --filter @zugfolge/runtime-native smoke:native

      - name: M15.4-Katalogcompiler und native Geometrie-Hashgrenze bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p zugfolge-fleet --bin zugfolge-vehicle-catalog -p zugfolge-conductor --example interior_json
          printf 'ZUGFOLGE_VEHICLE_CATALOG_TEST_BINARY=%s/target/release/zugfolge-vehicle-catalog\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'ZUGFOLGE_INTERIOR_TEST_BINARY=%s/target/release/examples/interior_json\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: M15-Sitzungsquelle aus den echten M5-, M10- und Betriebskernen bauen
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p zugfolge-conductor-session --example session_fixture
          cargo build --release --locked -p zugfolge-conductor-dialogue --example dialogue_json
          printf 'ZUGFOLGE_SESSION_FIXTURE_BINARY=%s/target/release/examples/session_fixture\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'ZUGFOLGE_DIALOGUE_TEST_BINARY=%s/target/release/examples/dialogue_json\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: M3-Planning-Worker und TypeScript-Grenzen bauen
        run: pnpm --filter @zugfolge/planning-worker... build

      - name: M3-Planning-Node-Addon mit registrierter NAPI-Grenze bauen
        run: cargo build --release --locked -p zugfolge-planning-runtime-napi --features node-addon

      - name: M3-Planning-cdylib als Node-Addon bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          addon_path="${RUNNER_TEMP}/zugfolge-planning-runtime-napi.node"
          test -f target/release/libzugfolge_planning_runtime_napi.so
          install -m 0755 target/release/libzugfolge_planning_runtime_napi.so "${addon_path}"
          file "${addon_path}"
          printf 'ZUGFOLGE_PLANNING_RUNTIME_NATIVE_PATH=%s\n' "${addon_path}" >> "${GITHUB_ENV}"

      - name: Echter PlanningRun-, Projektions-, Apply- und Replay-Smoke
        run: pnpm --filter @zugfolge/planning-runtime-native smoke:native

      - name: M3-Planning-Worker mit echtem NAPI und PGlite komponieren
        run: pnpm --filter @zugfolge/planning-worker test:native

      - name: M6-End-to-End mit PGlite, echtem Browser und Plattformeffekten
        env:
          ZUGFOLGE_BROWSER_E2E: "1"
        run: |
          pnpm --filter @zugfolge/game-api... build
          pnpm --filter @zugfolge/game-web... build
          pnpm --filter @zugfolge/operations-center... build
          # Echte NAPI-Registries und PGlite-Welten nicht zwischen Vitest-Worker-Isolates parallelisieren.
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/world-deployment-runtime.test.ts src/fleet-configuration.native.integration.test.ts src/economy-native.integration.test.ts src/disruption-policy-admin.test.ts src/manual-disruption-catalog.native.integration.test.ts src/demand-service.test.ts src/spfv-native.integration.test.ts src/conductor-projection.native.integration.test.ts src/conductor-interior.native.integration.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/operations-browser.e2e.test.ts src/game-hints.browser.test.ts src/demand-browser.e2e.test.ts
          # Echter Alpha-Builder -> serialisierter Compact-v2-Vertrag -> Serverstart-Registry.
          node --test tools/region-import/build-alpha-world-runtime.integration.test.mjs

      - name: Direkte Odoo-Nachfragedaten mit echtem Rust, PGlite und Restore
        run: pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/demand-population-data.integration.test.ts src/demand-population-initialization.test.ts

      - name: M10-Haltbelege, Journalcursor und native Fahrgastfortschreibung
        run: pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/demand-progress.test.ts src/demand-pool-seeds.test.ts src/demand-pool-lifecycle.test.ts src/demand-offer-history.test.ts src/demand-operational-native.integration.test.ts

      - name: M15-Sitzungen, private Persistenz, Releasepins und tatsächliche Szenenprojektion
        env:
          ZUGFOLGE_DIALOGUE_SCENARIOS_REPORT_PATH: ${{ runner.temp }}/conductor-session/dialogue-http-report.json
        run: |
          pnpm --filter @zugfolge/runtime-native exec vitest run --no-file-parallelism src/scenes.test.ts src/operational-fare-control.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/conductor-session.native.integration.test.ts src/conductor-session.handover.native.integration.test.ts src/conductor-session-configuration.test.ts src/conductor-scene-configuration.test.ts src/operational-fare-control-event.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/conductor-control.native.integration.test.ts src/conductor-control-penalty.native.integration.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/conductor-network.native.integration.test.ts src/conductor-acceptance.native.integration.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/conductor-dialogue-scenarios.native.integration.test.ts

      - name: PostgreSQL-Migration, Weltisolation und Autorisierung
        env:
          TEST_DATABASE_URL: postgres://zugfolge:zugfolge-test@127.0.0.1:5432/zugfolge_integration
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" node packages/db/dist/migrate.js
          DATABASE_URL="$TEST_DATABASE_URL" node packages/db/dist/migrate.js
          pnpm --filter @zugfolge/db exec vitest run src/postgres.integration.test.ts
          pnpm --filter @zugfolge/alpha exec vitest run src/world-end.postgres.integration.test.ts
          pnpm --filter @zugfolge/game-api exec vitest run src/world-access-postgres.integration.test.ts

      - name: M10-MapLibre mit Deutschland- und Knotenlast
        env:
          ZUGFOLGE_BROWSER_E2E: "1"
        run: |
          pnpm --filter @zugfolge/livemap... build
          pnpm --filter @zugfolge/game-api exec vitest run --no-file-parallelism src/demand-map-browser.e2e.test.ts

      - name: M15.3-Atlasgalerie mit echtem Browser und mobilen Pixelzooms
        shell: bash
        env:
          ART_PREVIEW_BROWSER_TEST: "1"
          ART_PREVIEW_SCREENSHOT_DIR: ${{ runner.temp }}/art-atlas/screenshots
          ART_PREVIEW_REPORT_PATH: ${{ runner.temp }}/art-atlas/browser-report.json
        run: |
          set -euo pipefail
          # Wie M6/M10 den vorhandenen Systembrowser verwenden; playwright-core lädt keinen Browser herunter.
          for art_browser in "${ZUGFOLGE_BROWSER_EXECUTABLE:-}" /usr/bin/google-chrome /usr/bin/chromium; do
            if [[ -n "${art_browser}" && -x "${art_browser}" ]]; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="${art_browser}"
              break
            fi
          done
          if [[ -z "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}" ]]; then
            echo "M15.3-Browserprüfung benötigt Chrome oder Chromium." >&2
            exit 1
          fi
          node --test tools/art-atlas/preview.test.mjs

      - name: M15.4-Innenräume aus M5 im echten Browser begehen
        shell: bash
        env:
          CONDUCTOR_INTERIOR_BROWSER_TEST: "1"
          CONDUCTOR_INTERIOR_SCREENSHOT_DIR: ${{ runner.temp }}/conductor-interior/screenshots
          CONDUCTOR_INTERIOR_REPORT_PATH: ${{ runner.temp }}/conductor-interior/browser-report.json
        run: |
          set -euo pipefail
          for interior_browser in "${ZUGFOLGE_BROWSER_EXECUTABLE:-}" /usr/bin/google-chrome /usr/bin/chromium; do
            if [[ -n "${interior_browser}" && -x "${interior_browser}" ]]; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="${interior_browser}"
              break
            fi
          done
          test -n "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}"
          node --test tools/conductor-interior/server.test.mjs tools/conductor-interior/preview.test.mjs

      - name: M15-Sitzung im tatsächlichen Desktop- und Touchbrowser
        shell: bash
        env:
          CONDUCTOR_SESSION_BROWSER_TEST: "1"
          CONDUCTOR_CONTROL_BROWSER_TEST: "1"
          CONDUCTOR_CAPACITY_BROWSER_TEST: "1"
          CONDUCTOR_MANIFEST_BROWSER_TEST: "1"
          CONDUCTOR_ACCEPTANCE_BROWSER_TEST: "1"
          CONDUCTOR_ENTRY_BROWSER_TEST: "1"
          CONDUCTOR_SESSION_SCREENSHOT_DIR: ${{ runner.temp }}/conductor-session/screenshots
          CONDUCTOR_SESSION_REPORT_PATH: ${{ runner.temp }}/conductor-session/browser-report.json
          CONDUCTOR_CONTROL_REPORT_PATH: ${{ runner.temp }}/conductor-session/control-browser-report.json
          CONDUCTOR_CAPACITY_REPORT_PATH: ${{ runner.temp }}/conductor-session/capacity-browser-report.json
          CONDUCTOR_MANIFEST_REPORT_PATH: ${{ runner.temp }}/conductor-session/manifest-browser-report.json
          CONDUCTOR_ACCEPTANCE_REPORT_PATH: ${{ runner.temp }}/conductor-session/acceptance-browser-report.json
          CONDUCTOR_ENTRY_REPORT_PATH: ${{ runner.temp }}/conductor-session/entry-browser-report.json
        run: |
          set -euo pipefail
          for conductor_browser in "${ZUGFOLGE_BROWSER_EXECUTABLE:-}" /usr/bin/google-chrome /usr/bin/chromium; do
            if [[ -n "${conductor_browser}" && -x "${conductor_browser}" ]]; then
              export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="${conductor_browser}"
              break
            fi
          done
          test -n "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}"
          node --test tools/conductor-session/browser-proof.mjs
          node --test tools/conductor-session/control-browser-proof.mjs
          node --test tools/conductor-session/capacity-browser-proof.mjs
          node --test tools/conductor-session/manifest-browser-proof.mjs
          node --test tools/conductor-session/acceptance-browser-proof.mjs
          node --test tools/conductor-session/entry-browser-proof.mjs
          node tools/conductor-session/package-evidence.mjs "$RUNNER_TEMP/conductor-session" "$GITHUB_SHA" "https://github.com/larynxberlin-rgb/Zugfolge/actions/runs/$GITHUB_RUN_ID"

      - name: M15-Browserbelege aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conductor-session-browser-evidence
          path: ${{ runner.temp }}/conductor-session
          if-no-files-found: ignore

  guards:
    # ASCII-only: GitHub branch protection compares this check name byte-for-byte.
    # Keeping non-ASCII out prevents a required-check context such as `W?chter`
    # from becoming permanently pending due to encoding loss.
    name: Waechter (harte Invarianten)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @zugfolge/guards run build

      - name: Waechter laufen lassen
        run: pnpm --filter @zugfolge/guards run guards

      - name: Node-Abhaengigkeiten pruefen
        run: |
          pnpm audit --audit-level=moderate
          pnpm licenses list --json | node tools/guards/dist/licenses-cli.js

      - name: Roadmap-Manifest pruefen
        run: |
          node --test .github/scripts/sync-milestones.test.mjs
          node .github/scripts/sync-milestones.mjs check
