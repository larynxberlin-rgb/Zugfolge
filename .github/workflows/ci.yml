name: CI

on:
  push:
    branches: ["main", "m0.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Zwei Betriebssysteme sind hier kein Luxus: Der Golden-Master des
    # Determinismus-Tests muss auf beiden derselbe sein. Genau das ist der
    # Beweis von M0.2.
    name: Rust und Determinismus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Formatierung
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy (Invarianten 2, 3 und 7)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests und Golden-Master
        run: cargo test --workspace --locked

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bau vor Typprüfung: Seit M2.1 hängt apps/game-api als Workspace-Paket
      # von packages/identity ab und löst es über dessen dist/-Ausgabe auf
      # (package.json "exports"). pnpm baut rekursive Skripte zwar
      # topologisch sortiert, aber "typecheck" und "build" sind zwei
      # getrennte Skriptläufe — ohne einen vorherigen Bau fehlt dist/ noch,
      # wenn die Typprüfung eines abhängigen Pakets läuft.
      - name: Bau
        run: pnpm -r --stream build

      - name: Typprüfung
        run: pnpm -r --stream typecheck

      - name: Tests
        run: pnpm -r --stream test

  integration-api:
    name: API-Integration (Postgres, Auth, Replay, Livemap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --stream build
      - run: pnpm --filter @zugfolge/game-api test

  load:
    name: Lastziel M4.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: 180.000 Zugläufe und mindestens 2 Mio. Ereignisse
        run: cargo run --release --locked -p zugfolge-load

  security-node:
    name: Sicherheits-Scan (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bekannte Schwachstellen ab moderate ablehnen
        run: pnpm audit --audit-level=moderate

  guards:
    name: Wächter (harte Invarianten)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @zugfolge/guards run build

      - name: Wächter laufen lassen
        run: pnpm --filter @zugfolge/guards run guards

  reference-corpus:
    name: GTFS-Planung, Referenzkorpus und Release-Signatur
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zugfolge/gtfs build
      - name: Capture, Planung, Statistik und Manipulationserkennung testen
        run: pnpm --filter @zugfolge/reference-corpus test

  licenses-node:
    name: Lizenz-Scan (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @zugfolge/guards run build

      - name: Lizenzen auswerten
        run: pnpm licenses list --json | node tools/guards/dist/licenses-cli.js --report=lizenzbericht.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lizenzbericht-node
          path: lizenzbericht.md
          if-no-files-found: warn

  licenses-rust:
    name: Lizenz-Scan (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses sources advisories
