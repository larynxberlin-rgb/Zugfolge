name: Setup-Skript prüfen

# Ein Setup-Skript, das niemand prüft, ist nach dem dritten Milestone kaputt —
# und zwar genau dann, wenn jemand Neues eine Umgebung braucht.
#
# Der Lauf startet bewusst in einem **nackten Debian-Container** statt auf dem
# GitHub-Runner: Der Runner bringt Node und Rust bereits mit, und dann prüfte
# der Test nur die Erkennungspfade, nie die Installation.
#
# Läuft nur, wenn sich das Skript oder dieser Workflow ändert.

on:
  push:
    paths:
      - ".claude/setup.sh"
      - ".github/workflows/setup.yml"
  pull_request:
    paths:
      - ".claude/setup.sh"
      - ".github/workflows/setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frische-umgebung:
    name: Nacktes Debian
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Grundwerkzeug (das, was das Skript voraussetzt)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git tar xz-utils build-essential
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Setup-Skript ausführen
        run: bash .claude/setup.sh

      - name: Zweiter Lauf — das Skript muss wiederholbar sein
        run: bash .claude/setup.sh

      - name: Werkzeuge sind auch in einer neuen Login-Shell da
        run: bash -lc 'cargo --version && node --version && pnpm --version'
