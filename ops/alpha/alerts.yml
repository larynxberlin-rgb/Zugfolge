groups:
  - name: zugfolge-alpha-availability
    rules:
      - alert: ZugfolgeGameApiDown
        expr: up{job="zugfolge-game-api"} == 0
        for: 1m
        labels: { severity: critical, runbook: game-api-down }
        annotations: { summary: "Game API ist nicht erreichbar" }
      - alert: ZugfolgeOdooDown
        expr: up{job="zugfolge-odoo"} == 0
        for: 5m
        labels: { severity: warning, runbook: odoo-down }
        annotations: { summary: "Odoo ist ausgefallen; der Spielbetrieb muss weiterlaufen" }
      - alert: ZugfolgeSubsystemDown
        expr: zugfolge_health_check_state{state="down"} == 1
        for: 2m
        labels: { severity: critical, runbook: subsystem-down }
        annotations: { summary: "Subsystem {{ $labels.check }} meldet down" }
      - alert: ZugfolgeSubsystemDegraded
        expr: zugfolge_health_check_state{state="degraded"} == 1
        for: 10m
        labels: { severity: warning, runbook: subsystem-degraded }
        annotations: { summary: "Subsystem {{ $labels.check }} bleibt degraded" }
      - alert: ZugfolgeHealthSignalMissing
        expr: (label_replace(vector(1), "check", "postgres", "", "") or label_replace(vector(1), "check", "simulation-event-log", "", "") or label_replace(vector(1), "check", "economy-outbox", "", "") or label_replace(vector(1), "check", "economy-scheduler", "", "") or label_replace(vector(1), "check", "regional-simulation-scheduler", "", "") or label_replace(vector(1), "check", "livemap-freshness", "", "") or label_replace(vector(1), "check", "disruption-provider", "", "") or label_replace(vector(1), "check", "odoo-bridge", "", "")) unless on (check) count by (check) (zugfolge_health_check_state{check=~"postgres|simulation-event-log|economy-outbox|economy-scheduler|regional-simulation-scheduler|livemap-freshness|disruption-provider|odoo-bridge"})
        for: 5m
        labels: { severity: warning, runbook: telemetry-gap }
        annotations: { summary: "Verpflichtendes Alpha-Healthsignal {{ $labels.check }} fehlt" }
      - alert: ZugfolgeApiErrorRate
        expr: sum(rate(zugfolge_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(zugfolge_http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: { severity: critical, runbook: game-api-errors }
        annotations: { summary: "Game API hat mehr als zwei Prozent 5xx" }
      - alert: ZugfolgeApiLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(zugfolge_http_request_duration_milliseconds_bucket[5m]))) > 1000
        for: 10m
        labels: { severity: warning, runbook: game-api-latency }
        annotations: { summary: "Game API p95 liegt ueber einer Sekunde" }
      - alert: ZugfolgeAuthoritativeEventStale
        expr: zugfolge_alpha_event_age_seconds > 60
        for: 2m
        labels: { severity: critical, runbook: simulation-stale }
        annotations: { summary: "Autoritativer Eventstand von {{ $labels.world_id }} ist aelter als 60 Sekunden" }
      - alert: ZugfolgeOdooProjectionBacklog
        expr: zugfolge_alpha_odoo_projection_pending > 0
        for: 10m
        labels: { severity: warning, runbook: odoo-bridge-backlog }
        annotations: { summary: "Odoo-Projektionen von {{ $labels.world_id }} warten seit mindestens zehn Minuten" }
      - alert: ZugfolgeOdooProjectionFailure
        expr: zugfolge_alpha_odoo_projection_failed > 0
        for: 2m
        labels: { severity: warning, runbook: odoo-bridge-failure }
        annotations: { summary: "Odoo-Bridge von {{ $labels.world_id }} meldet fehlgeschlagene Projektionen" }
