# Lizenz- und Herkunftsprüfung der Rust-Abhängigkeiten (cargo-deny).
#
# Die Allowlist ist absichtlich kurz. Eine neue Lizenz wird nicht ergänzt,
# weil die CI rot ist, sondern nachdem geprüft wurde, ob sie mit einem
# Source-Available-Produkt vereinbar ist (E16, docs/geschaeft.md 4).
#
# Das Gegenstück für die Node-Abhängigkeiten steht in
# tools/guards/guards.config.json und läuft über `pnpm licenses list --json`.

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Die eigenen Crates tragen LicenseRef-PolyForm-Shield-1.0.0 und sind nicht
# veröffentlichbar (`publish = false`). Sie werden deshalb übersprungen.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
