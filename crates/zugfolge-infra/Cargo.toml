[package]
name = "zugfolge-infra"
description = "Infra-Release-Pipeline: Domänenmodell des Betriebsgraphen (M1.1), Import-Pipeline OSM-PBF → Rohgraph (M1.2), Netzfilter (M1.3), Abdeckungsmessung (M1.4), Neigungsprofil aus Höhenmodell (M1.5), Blockableitung (M1.6), Fahrstraßen- und Durchrutschwegableitung (M1.7), Stationsdaten-Anreicherung (M1.8), Zugcharakteristik (M1.9), Fahrdynamik und Fahrzeitrechner (M1.10), Anlagenkataster (M1.11), InfraRelease (M1.12) und Referenzkorpus mit Abweichungsreport (M1.13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde_json.workspace = true
sha2.workspace = true
zugfolge-determinism = { workspace = true }

[dev-dependencies]
